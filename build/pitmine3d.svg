<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12808c"/>
      <stop offset="1" stop-color="#0a555d"/>
    </linearGradient>
    <linearGradient id="pit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7f6"/>
      <stop offset="1" stop-color="#bfd6d6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- 露天矿：自上而下收缩的台阶(benches)，俯视递降 -->
  <g fill="none" stroke="url(#pit)" stroke-width="9" stroke-linejoin="round" opacity="0.96">
    <ellipse cx="128" cy="120" rx="86" ry="42"/>
    <ellipse cx="128" cy="132" rx="64" ry="31" opacity="0.85"/>
    <ellipse cx="128" cy="144" rx="42" ry="20" opacity="0.7"/>
    <ellipse cx="128" cy="156" rx="21" ry="10" opacity="0.55"/>
  </g>
  <!-- 底坑 -->
  <ellipse cx="128" cy="164" rx="8" ry="4" fill="#f4f7f6" opacity="0.9"/>
  <!-- 坑沿标记 -->
  <circle cx="214" cy="120" r="6" fill="#f4f7f6" opacity="0.9"/>
</svg>
